<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>何倍？ タイムアタック</title><style>
:root{font-family:system-ui,-apple-system,'Hiragino Kaku Gothic ProN',sans-serif;color:#173047;background:#f3f8fc}*{box-sizing:border-box}body{margin:0}main{max-width:900px;margin:auto;padding:22px 18px 38px}header{display:flex;justify-content:space-between;gap:10px;align-items:center}h1{font-size:clamp(23px,5vw,35px);margin:10px 0}.tag{background:#d9ecf6;border-radius:20px;padding:8px 13px;font-weight:700}.card{background:white;border-radius:24px;padding:clamp(22px,5vw,44px);box-shadow:0 8px 26px #1234;margin-top:20px;text-align:center}.sub{color:#547085;font-size:17px}.big{font-weight:850;font-size:clamp(33px,7.8vw,70px);line-height:1.5;margin:40px 0;min-height:140px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap}.stats{display:flex;justify-content:space-between;gap:10px;font-size:clamp(17px,3.4vw,24px);font-weight:700}.timer{font-variant-numeric:tabular-nums}.buttons{display:flex;justify-content:center;flex-wrap:wrap;gap:12px}button{font:inherit;font-size:clamp(19px,3vw,25px);font-weight:800;padding:17px 32px;border:0;border-radius:15px;min-height:58px;cursor:pointer;background:#1268b4;color:white}button.secondary{background:#e4eef6;color:#173047}button:focus-visible{outline:4px solid #f5a623;outline-offset:3px}button:disabled{opacity:.5;cursor:default}.note{font-size:15px;line-height:1.8;color:#547085;text-align:left;margin:25px 0 0}.result{font-size:clamp(46px,10vw,86px);font-weight:900;color:#1268b4;font-variant-numeric:tabular-nums}.history{text-align:left;margin:20px auto;max-width:450px}.history li{padding:5px} .hidden{display:none!important}@media(max-width:420px){.card{padding:20px 15px}.big{margin:22px 0;min-height:170px}.tag{font-size:12px}}
</style></head><body><main><header><h1>⚡ 何倍？ タイムアタック</h1><span class="tag">小学5年生 算数</span></header><section class="card"><div class="stats"><span id="progress">40問からランダムに10問</span><span class="timer" id="timer">0.00 秒</span></div><div class="big" id="question" aria-live="polite">10問に何秒で答えられるかな？</div><div id="intro"><p class="sub">1人ずつ10問連続チャレンジ！<br>答えたら、係の人が「次へ」を押そう。</p><div class="buttons"><button id="start">スタート！</button></div></div><div id="playing" class="hidden"><div class="buttons"><button id="next">次の問題 →</button></div></div><div id="finished" class="hidden"><div class="sub">10問クリア！ 記録は…</div><div class="result" id="result"></div><div class="buttons"><button id="again">次の人が挑戦 →</button><button class="secondary" id="reset">記録をリセット</button></div><div class="history"><strong>このiPadでの記録</strong><ol id="history"></ol></div></div><p class="note">【ルール】1人が10問答えます。正解したら係の人が「次の問題」を押します。10問目に正解したら「ゴール！」を押してタイマーを止めます。答えは画面に出ません。問題番号は先生の解答一覧と対応しています。<br>※ 問題の順番は毎回変わります。通信なしでもこのファイルを開けば動きます。</p></section></main><script>
(()=>{'use strict';const pairs=[[3,4],[6,4],[2,5],[7,3],[9,6],[5,8],[4,5],[8,5],[3,8],[11,4],[5,3],[7,2],[4,9],[9,4],[6,5],[7,8],[5,6],[8,3],[2,7],[12,5],[3,2],[5,4],[7,10],[9,8],[4,7],[11,5],[8,9],[13,4],[6,7],[10,3],[1,4],[3,5],[7,4],[11,8],[5,9],[9,5],[2,3],[13,5],[4,3],[7,5]];const $=id=>document.getElementById(id);let selected=[],idx=0,startAt=0,frame=null,running=false,records=[];function elapsed(){return (performance.now()-startAt)/1000}function clock(){if(!running)return;$('timer').textContent=elapsed().toFixed(2)+' 秒';frame=requestAnimationFrame(clock)}function stop(){running=false;if(frame!==null)cancelAnimationFrame(frame);frame=null}function show(id){['intro','playing','finished'].forEach(k=>$(k).classList.toggle('hidden',k!==id))}function render(){const [a,b]=pairs[selected[idx]];$('progress').textContent=`${idx+1} / 10 問　｜　問題番号 ${String(selected[idx]+1).padStart(2,'0')}`;$('question').textContent=`${a}m は ${b}m の何倍？`;$('next').textContent=idx===9?'ゴール！':'次の問題 →'}function begin(){stop();selected=pairs.map((_,i)=>i);for(let i=selected.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[selected[i],selected[j]]=[selected[j],selected[i]]}selected=selected.slice(0,10);idx=0;render();show('playing');startAt=performance.now();running=true;clock()}function next(){if(!running)return;if(idx<9){idx++;render()}else{const t=elapsed();stop();$('timer').textContent=t.toFixed(2)+' 秒';$('result').textContent=t.toFixed(2)+' 秒';records.push(t);$('history').replaceChildren(...records.map((v,i)=>{const li=document.createElement('li');li.textContent=`${i+1}人目：${v.toFixed(2)} 秒`;return li}));$('progress').textContent='10 / 10 問 完了';$('question').textContent='🎉 おつかれさま！';show('finished')}}$('start').addEventListener('click',begin);$('again').addEventListener('click',begin);$('next').addEventListener('click',next);$('reset').addEventListener('click',()=>{records=[];$('history').replaceChildren();begin()});})();
</script></body></html>
